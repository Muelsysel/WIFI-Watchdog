name: Feature request
about: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 你希望解决什么实际使用问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: risk
    attributes:
      label: Network / recovery safety considerations
      description: 如果功能会修改网卡、路由、DNS、代理或服务，请说明可能的误伤场景。
