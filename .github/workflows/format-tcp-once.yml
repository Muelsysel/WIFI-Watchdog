name: Format TCP fallback fix once

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix-tcp-only-false-online-v1.6.2'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-tcp-only-false-online-v1.6.2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format Go changes
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter '*.go' -File | ForEach-Object { $_.FullName }
          gofmt -w $files
          git -c core.autocrlf=false add -- '*.go'
          if (git diff --cached --quiet) { exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: gofmt TCP-only fallback repair"
          git push origin HEAD:fix-tcp-only-false-online-v1.6.2
