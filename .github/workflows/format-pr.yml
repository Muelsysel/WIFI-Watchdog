name: One-time format PR

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'improve-v1.4.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: improve-v1.4.0
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format Go sources
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { $_.FullName }
          gofmt -w $goFiles
          if (git status --porcelain -- '*.go') {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go'
            git commit -m "style: gofmt final v1.4.0 sources"
            git push origin HEAD:improve-v1.4.0
          } else {
            Write-Host "All Go files already formatted."
          }
