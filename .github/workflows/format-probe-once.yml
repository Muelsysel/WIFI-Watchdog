name: Normalize HTTP Probe Patch Once

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix-probe-result-clarity-v1.6.1'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-probe-result-clarity-v1.6.1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Normalize Go formatting
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Filter '*.go' -File | ForEach-Object { $_.FullName }
          gofmt -w $goFiles
          git -c core.autocrlf=false add -- '*.go'
          if (git diff --cached --quiet) {
            Write-Host 'Go source already formatted.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: gofmt HTTP probe diagnostics patch'
          git push origin HEAD:fix-probe-result-clarity-v1.6.1
