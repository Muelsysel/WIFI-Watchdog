name: Studio Windows CI

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/studio-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify Studio core (without UI)
        run: dotnet run -c Release --project desktop/WiFiWatchdog.Studio.Tests/WiFiWatchdog.Studio.Tests.csproj

      - name: Compile native Windows desktop UI
        run: dotnet build desktop/WiFiWatchdog.Studio/WiFiWatchdog.Studio.csproj -c Release
        # restore is performed explicitly below in future release jobs

      - name: Publish self-contained x64 Studio
        shell: pwsh
        run: |
          dotnet publish desktop/WiFiWatchdog.Studio/WiFiWatchdog.Studio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o dist/Studio
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/Studio/Engine | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/Studio/Engine/WiFiWatchdog.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item desktop/README.md dist/Studio/README.md
          Copy-Item LICENSE dist/Studio/LICENSE
          Compress-Archive -Path dist/Studio/* -DestinationPath dist/WiFiWatchdog-Studio-win-x64-preview.zip -Force
          Get-FileHash dist/WiFiWatchdog-Studio-win-x64-preview.zip -Algorithm SHA256 | Format-List
      - name: Install NSIS compiler (build tools only)
        shell: pwsh
        run: |
          $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.11.zip'
          $root = Join-Path $env:RUNNER_TEMP 'nsis-3.11-pinned'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 8
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') {
            throw "Pinned NSIS archive checksum mismatch: $actual"
          }
          Expand-Archive $archive $root -Force
          $compiler = Get-ChildItem $root -Filter makensis.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          if (!$compiler) { throw 'Pinned NSIS archive lacks makensis.exe' }
          "NSIS_COMPILER=$compiler" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV


      - name: Compile per-user Studio installer
        shell: pwsh
        run: |
          $compiler = $env:NSIS_COMPILER
          if (!(Test-Path $compiler)) { throw "NSIS compiler missing" }
          $source = (Resolve-Path dist/Studio).Path
          $out = Join-Path (Resolve-Path dist).Path "WiFiWatchdog-Studio-Setup-x64.exe"
          & $compiler "/DSTUDIO_SOURCE=$source" "/DSTUDIO_OUTPUT=$out" "/DSTUDIO_VERSION=0.3.0-preview" desktop/installer/studio.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Silent installer/uninstaller smoke test - preserve user data
        shell: pwsh
        run: |
          $setup = (Resolve-Path dist/WiFiWatchdog-Studio-Setup-x64.exe).Path
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\\WiFiWatchdogStudio'
          $sentinel = Join-Path $env:LOCALAPPDATA 'WiFiWatchdog\\Studio\\ci-keep-data.txt'
          New-Item -ItemType Directory -Force (Split-Path $sentinel) | Out-Null
          Set-Content -Path $sentinel -Value 'user-data-survives-uninstall'
          try {
            $install = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
            if (!(Test-Path (Join-Path $appDir 'WiFiWatchdog.Studio.exe'))) { throw 'Studio exe missing after install' }
            if (!(Test-Path (Join-Path $appDir 'Engine\\WiFiWatchdog.exe'))) { throw 'Go engine missing after install' }
            $uninstall = Join-Path $appDir 'Uninstall.exe'
            $removed = Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
            if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
            if (!(Test-Path $sentinel)) { throw 'Uninstaller deleted user data' }
            Write-Host 'Per-user install/uninstall smoke test passed; user data preserved.'
          } finally { Remove-Item $sentinel -Force -ErrorAction SilentlyContinue }

      - uses: actions/upload-artifact@v4
        with:
          name: WiFiWatchdog-Studio-Windows-x64
          path: |
            dist/WiFiWatchdog-Studio-win-x64-preview.zip
            dist/WiFiWatchdog-Studio-Setup-x64.exe
          if-no-files-found: error
