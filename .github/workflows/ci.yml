name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting (advisory)
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { $_.FullName }
          $files = gofmt -l $goFiles
          if ($files) {
            Write-Warning ("gofmt recommended for:`n" + ($files -join "`n"))
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows amd64
        run: go build -trimpath -ldflags "-H=windowsgui" -o WiFiWatchdog.exe .
