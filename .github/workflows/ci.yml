name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { $_.FullName }
          $unformatted = gofmt -l $goFiles
          if ($unformatted) {
            Write-Error ("gofmt required:`n" + ($unformatted -join "`n"))
            exit 1
          }

      - name: Test
        run: go test -count=1 -timeout 2m ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows amd64
        run: go build -trimpath -ldflags "-H=windowsgui" -o WiFiWatchdog-amd64.exe .

      - name: Build Windows arm64
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          go build -trimpath -ldflags "-H=windowsgui" -o WiFiWatchdog-arm64.exe .
