name: Format Fluent UI PR once

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat-fluent-lite-ui-v1.6.0'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat-fluent-lite-ui-v1.6.0
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Normalize Go sources
        shell: pwsh
        run: |
          $files = Get-ChildItem -Filter '*.go' -File | ForEach-Object { $_.FullName }
          gofmt -w $files
          git -c core.autocrlf=false add -- '*.go'
          if (git diff --cached --quiet) {
            Write-Host "No formatting changes"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: gofmt Fluent Lite UI"
          git push origin HEAD:feat-fluent-lite-ui-v1.6.0
