name: Bootstrap source tree

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Switch to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B publish-source origin/main

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/parts/part-* | tr -d '\r\n' > source.b64
          base64 --decode source.b64 > source.tar.xz
          echo "f104d193268999dd961a62683ea69c84bc7c63b8c7f874565b6562092055af45  source.tar.xz" | sha256sum -c -

      - name: Extract source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wifi-watchdog-source
          mkdir -p /tmp/wifi-watchdog-source
          tar -xJf source.tar.xz -C /tmp/wifi-watchdog-source
          cp -a /tmp/wifi-watchdog-source/. .
          rm -rf .bootstrap source.b64 source.tar.xz
          # GitHub Actions' GITHUB_TOKEN cannot create/update workflow files
          # in this repo. Keep the bootstrap workflow unchanged and let the
          # connected GitHub app publish CI/Release workflows afterward.
          rm -f .github/workflows/ci.yml .github/workflows/release.yml

      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: publish WiFi Watchdog v1.3.0 source"
          git push origin HEAD:main
