name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Format, test and vet
        shell: pwsh
        run: |
          $goFiles = Get-ChildItem -Path . -Filter *.go -File | ForEach-Object { $_.FullName }
          $unformatted = gofmt -l $goFiles
          if ($unformatted) {
            Write-Error ("gofmt required:`n" + ($unformatted -join "`n"))
            exit 1
          }
          go test -count=1 -timeout 2m ./...
          go vet ./...

      - name: Build release archives
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $version = "${{ github.ref_name }}".TrimStart('v')
          $ldflags = "-H=windowsgui -s -w -X main.appVersion=$version"
          @(
            "Version: $version"
            "Tag: ${{ github.ref_name }}"
            "Commit: ${{ github.sha }}"
            "Go: $(go version)"
            "Built: $(Get-Date -Format o)"
          ) | Set-Content -Encoding utf8 dist/BUILDINFO.txt

          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            $folder = "dist/WiFiWatchdog-windows-$arch"
            New-Item -ItemType Directory -Force $folder | Out-Null
            go build -trimpath -ldflags $ldflags -o "$folder/WiFiWatchdog.exe" .
            Copy-Item README.md, README_EN.md, LICENSE, CHANGELOG.md, config.schema.json $folder
            Copy-Item dist/BUILDINFO.txt $folder
            Compress-Archive -Path "$folder/*" -DestinationPath "dist/WiFiWatchdog-windows-$arch.zip" -Force
          }

          Get-ChildItem dist/*.zip | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content dist/SHA256SUMS.txt
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS.txt --generate-notes --title "WiFi Watchdog ${{ github.ref_name }}"
